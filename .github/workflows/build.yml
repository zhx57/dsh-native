name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DSH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dsh-release.jks"
            {
              echo "DSH_KEYSTORE_PATH=$RUNNER_TEMP/dsh-release.jks"
              echo "DSH_KEYSTORE_PASSWORD=${{ secrets.DSH_KEYSTORE_PASSWORD }}"
              echo "DSH_KEY_ALIAS=${{ secrets.DSH_KEY_ALIAS }}"
              echo "DSH_KEY_PASSWORD=${{ secrets.DSH_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "Signing key restored."
          else
            echo "No signing secret configured; the release APK stays unsigned and the debug APK is published."
          fi

      - name: Compile
        run: gradle :app:assembleRelease :app:assembleDebug --stacktrace --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-native-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: DSH Native ${{ github.run_number }}
          files: out/*.apk
          generate_release_notes: true
          make_latest: true
