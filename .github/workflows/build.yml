name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Resolve Android SDK
        run: |
          # The runner image ships an Android SDK; only add what the build needs.
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)"
          fi
          echo "Platforms present:"; ls "$SDK/platforms" 2>/dev/null || true
          if [ ! -d "$SDK/platforms/android-35" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" || true
          fi
          ls "$SDK/platforms" 2>/dev/null || true

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DSH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dsh-release.jks"
            {
              echo "DSH_KEYSTORE_PATH=$RUNNER_TEMP/dsh-release.jks"
              echo "DSH_KEYSTORE_PASSWORD=${{ secrets.DSH_KEYSTORE_PASSWORD }}"
              echo "DSH_KEY_ALIAS=${{ secrets.DSH_KEY_ALIAS }}"
              echo "DSH_KEY_PASSWORD=${{ secrets.DSH_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "Signing key restored."
          else
            echo "No signing secret configured; the release APK stays unsigned."
          fi

      # One invocation: one configuration phase, and one compile of the sources.
      #
      # This used to be two steps, each with `--no-daemon`: the flag threw away the
      # daemon that would have carried incremental state between the tasks, the
      # configuration phase was paid twice, and Kotlin compiled twice because the
      # tests ran against the *debug* variant while the APK came from *release*.
      # `testReleaseUnitTest` reuses the exact classes `assembleRelease` needs.
      #
      # `assembleDebug` is gone too: the installed APK is the release one, so the
      # debug variant was a full extra compile plus packaging for an unused artifact.
      #
      # Build caching and the configuration cache are enabled in gradle.properties, so
      # no flags are needed here.
      - name: Test and build
        run: gradle :app:testReleaseUnitTest :app:assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-native-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: DSH Native ${{ github.run_number }}
          files: out/*.apk
          generate_release_notes: true
          make_latest: true
