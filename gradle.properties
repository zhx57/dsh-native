org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Reuse the build configuration between tasks and runs instead of re-evaluating the
# whole script graph each time. Problems are downgraded to warnings so an
# incompatible plugin costs a log line, not a failed build.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Kotlin's own incremental compiler is what makes a one-file edit cheap; the
# classpath snapshot lets it notice that only a method body changed.
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
